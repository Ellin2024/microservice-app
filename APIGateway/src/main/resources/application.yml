server:
  port: 8080 

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route for Category Service
        - id: category-service
          uri: http://category-service:8081
          predicates:
            - Path=/api/category/**, /api/categories/**

        # Route for Product Service
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/product/**, /api/products/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/